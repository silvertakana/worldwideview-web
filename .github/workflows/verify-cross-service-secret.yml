name: Verify Cross Service Secret

on:
  pull_request:
    branches: [main]

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Print digest of CROSS_SERVICE_SECRET
        env:
          CROSS_SERVICE_SECRET: ${{ secrets.CROSS_SERVICE_SECRET }}
        run: printf '%s' "$CROSS_SERVICE_SECRET" | sha256sum
