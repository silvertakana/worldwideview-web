name: Stripe secret mode probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print Stripe secret prefixes and lengths
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          printf 'STRIPE_SECRET_KEY prefix: %s length: %s\n' "${STRIPE_SECRET_KEY:0:8}" "${#STRIPE_SECRET_KEY}"
          printf 'STRIPE_WEBHOOK_SECRET prefix: %s length: %s\n' "${STRIPE_WEBHOOK_SECRET:0:8}" "${#STRIPE_WEBHOOK_SECRET}"
